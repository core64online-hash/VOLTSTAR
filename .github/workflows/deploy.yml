name: Deploy

# Деплой через Coolify: staging — автоматично після зеленого CI на main;
# production — після ручного підтвердження (environment «production» з обовʼязковими
# рецензентами), зі smoke-тестами й автоматичним відкатом при провалі.
#
# Production запускається двома шляхами:
#   • автоматично після мержу в main — лише якщо задано змінну PRODUCTION_URL;
#   • вручну: Actions → Deploy → Run workflow → «Задеплоїти production» (змінна не потрібна).
# Змінна лишається головною: вона єдине, що стримує автоматичний деплой на бойовий домен
# після кожного зеленого CI, тому ручний прапорець свідомо окремий від неї.
#
# Увімкнення: Settings → Secrets and variables → Actions
#   variables: DEPLOY_ENABLED=true, STAGING_URL, PRODUCTION_URL (лише для автодеплою)
#   secrets:   COOLIFY_URL, COOLIFY_TOKEN, COOLIFY_STAGING_UUID, COOLIFY_PRODUCTION_UUID
# Докладно — docs/RUNBOOK.md.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Коміт або гілка для деплою (типово — main)"
        required: false
        default: main
      smoke_only:
        description: "Лише smoke-тести staging, без деплою (діагностика)"
        type: boolean
        required: false
        default: false
      smoke_url:
        description: "Адреса для smoke_only (типово — STAGING_URL)"
        required: false
        default: ""
      production:
        description: "Задеплоїти production (інакше — лише staging)"
        type: boolean
        required: false
        default: false
      production_url:
        description: "Адреса production для smoke-тестів"
        required: false
        default: "https://voltstar.pp.ua"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # переміщення гілки production (для деплою й відкату)

jobs:
  staging:
    name: Staging
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      # Перевірка в кроці, а не в `if` job: так DEPLOY_ENABLED можна тримати й у змінних
      # environment staging (у `if` job GitHub бачить лише змінні рівня репозиторію).
      - name: Деплой увімкнено?
        id: gate
        run: |
          if [ "${{ vars.DEPLOY_ENABLED }}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DEPLOY_ENABLED != true — деплой пропущено"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
      - if: steps.gate.outputs.enabled == 'true'
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Деплой у Coolify (staging, гілка main)
        if: steps.gate.outputs.enabled == 'true' && !inputs.smoke_only
        run: node scripts/coolify-deploy.mjs "${{ secrets.COOLIFY_STAGING_UUID }}"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      - name: Smoke-тести staging
        if: steps.gate.outputs.enabled == 'true'
        # Без деплою на staging працює main, а не перевірюваний коміт — версію не звіряємо.
        run: node scripts/smoke.mjs "${{ inputs.smoke_only && inputs.smoke_url || vars.STAGING_URL }}" ${{ !inputs.smoke_only && format('--version "{0}"', steps.sha.outputs.sha) || '' }} --retries 100

  production:
    name: Production
    needs: staging
    # Автоматичний деплой вмикається змінною PRODUCTION_URL (рівня репозиторію) — доти після
    # мержу їде лише staging. Ручний запуск із прапорцем `production` працює і без неї.
    if: >-
      needs.staging.outputs.enabled == 'true' && !inputs.smoke_only
      && (vars.PRODUCTION_URL != '' || inputs.production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Запамʼятати поточну версію production (для відкату)
        id: prev
        run: echo "sha=$(git rev-parse --verify -q origin/production || echo '')" >> "$GITHUB_OUTPUT"
      - name: Перемістити гілку production на перевірений коміт
        run: git push origin "${{ needs.staging.outputs.sha }}:refs/heads/production" --force
      - name: Деплой у Coolify (production, гілка production)
        run: node scripts/coolify-deploy.mjs "${{ secrets.COOLIFY_PRODUCTION_UUID }}"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      - name: Smoke-тести production
        id: smoke
        # Змінна головна; вхід — запасний шлях для ручного запуску, коли змінної немає.
        run: node scripts/smoke.mjs "${{ vars.PRODUCTION_URL || inputs.production_url }}" --version "${{ needs.staging.outputs.sha }}" --retries 100
      - name: Відкат на попередню версію
        if: failure() && steps.prev.outputs.sha != ''
        run: |
          echo "::error::Smoke-тести не пройдено — відкат на ${{ steps.prev.outputs.sha }}"
          git push origin "${{ steps.prev.outputs.sha }}:refs/heads/production" --force
          node scripts/coolify-deploy.mjs "${{ secrets.COOLIFY_PRODUCTION_UUID }}"
          node scripts/smoke.mjs "${{ vars.PRODUCTION_URL || inputs.production_url }}" --version "${{ steps.prev.outputs.sha }}" --retries 100
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
